<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Обіцянка даних 🤝🎁</title>
    <script src="./script.js" defer></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            text-align: center;
        }
        #data-container {
            min-height: 50px;
            padding: 20px;
            margin: 20px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        #load-button {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        #load-button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
    </style>
  </head>
  <body>
    <div id="data-container"></div>
    <button id="load-button">Завантажити</button>
  </body>
</html>
